# CCD Switch（原 CCBaga-A）本地维护构建：身份/前端/原生回归 + macOS arm64（debug、ad-hoc 签名）与 Windows x64 NSIS 安装包，均不含浏览器 B 引擎。
# UI 回归只使用 runner 已安装的 Chrome，不下载或构建浏览器 B。
# 推 cares/** 分支或向其提 PR 时跑全部检查并上传构建产物；推 v*local.* 标签只构建并发布 Release（zip + checksums.txt），
# 不重复跑测试——标签必须打在分支 CI 已通过的提交上。版本取 packaging/cares/local-build.json，标签须与之一致。
# 上游 checks.yml / release.yml 在本分支已删除；本工作流不用任何签名凭据，安装与本地签名在 mbp 上做。
name: cares-build

on:
  push:
    branches: ['cares/**']
    tags: ['v*local.*']
  pull_request:
    branches: ['cares/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: '12.0'
  # 只用身份切换，不打包浏览器 B 引擎；cargo test 也按此资源清单校验。
  TAURI_CONFIG: '{"bundle":{"resources":{"../browser-runtime/Browser.zip":null}}}'

jobs:
  build:
    # arm64 托管 runner 容量不足曾直接取消任务；Intel 上验证原生逻辑并交叉构建 arm64。
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CCBAGA_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 版本
        id: version
        run: |
          V=$(python3 -c "import json; print(json.load(open('packaging/cares/local-build.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "标签 $GITHUB_REF_NAME 与 local-build.json 版本 $V 不一致" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: 工具链与依赖
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-darwin
          bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: 回归测试
        if: github.ref_type != 'tag'
        run: |
          bun test
          bun run build
          bun run test:identities
          identity_test="$RUNNER_TEMP/ccbaga-identity-test"
          clang -fobjc-arc -framework Foundation -framework Security src-tauri/native/IdentityTests.m -o "$identity_test"
          "$identity_test"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: 构建 CCD Switch
        run: bun run tauri build --target aarch64-apple-darwin --bundles app --features custom-protocol --config packaging/cares/local-build.json
      - name: 打包
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p out
          ditto -c -k --keepParent "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/CCD Switch.app" "out/CCD-Switch_${V}_macos_arm64.zip"
          cd out && shasum -a 256 *.zip > checksums.txt && cat checksums.txt
      - uses: actions/upload-artifact@v5
        with:
          name: CCD-Switch-${{ steps.version.outputs.version }}-macos-arm64
          path: out/

  # Windows x64：当前用户 NSIS 安装包，同样不含浏览器 B 引擎与 B 快捷方式（packaging/cares/local-build-windows.json）。
  # Windows 独立构建，避免 macOS runner 排队阻塞；标签发布等两平台附件齐备再公开。
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      TAURI_CONFIG: '{"bundle":{"resources":{"../browser-runtime/version.txt":null,"../browser-runtime/LICENSE.fingerprint-chromium":null,"../browser-runtime/WindowsBrowser/":null,"../browser-runtime/icons/browser.ico":null},"windows":{"nsis":{"installerHooks":null}}}}'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 版本
        id: version
        shell: bash
        run: |
          V=$(python -c "import json; print(json.load(open('packaging/cares/local-build.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "标签与 local-build.json 版本不一致" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: 工具链与依赖
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup toolchain install 1.98.1 --profile minimal
          if($LASTEXITCODE){exit $LASTEXITCODE}
          rustup default 1.98.1
          bun install --frozen-lockfile
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-msvc
          cache-on-failure: true
      - name: 回归测试
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          bun test
          bun run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: 构建 CCD Switch 安装包
        shell: bash
        run: bun run tauri build --bundles nsis --features custom-protocol --config packaging/cares/local-build.json --config packaging/cares/local-build-windows.json
      - name: 打包
        shell: bash
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/CCD-Switch_${V}_windows_x64-setup.exe"
          cd out && sha256sum *.exe > checksums-windows.txt && cat checksums-windows.txt
      - uses: actions/upload-artifact@v5
        with:
          name: CCD-Switch-${{ steps.version.outputs.version }}-windows-x64
          path: out/
  release:
    if: github.ref_type == 'tag'
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: CCD-Switch-*
          path: out
          merge-multiple: true
      - name: 完整上传后公开 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v h="## [$V]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md 缺少 $V 小节" >&2; exit 1; }
          printf '\n---\n\nmacOS 为 ad-hoc 签名，Windows 安装包未代码签名。校验值见 checksums 附件。\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" out/* --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
