# CCBaga-A 本地维护构建：身份/前端/原生回归 + macOS arm64 宿主 A（debug、custom-protocol、ad-hoc 签名，不含浏览器 B 引擎）。
# 浏览器引擎只在分支构建时下载，供 UI 模拟测试当无头浏览器，不打进安装包。
# 推 cares/** 分支跑全部检查并上传构建产物；推 v*local.* 标签只构建并发布 Release（zip + checksums.txt），
# 不重复跑测试——标签必须打在分支 CI 已通过的提交上。版本取 packaging/cares/local-build.json，标签须与之一致。
# 上游 checks.yml / release.yml 在本分支已删除；本工作流不用任何签名凭据，安装与本地签名在 mbp 上做。
name: cares-build

on:
  push:
    branches: ['cares/**']
    tags: ['v*local.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: '12.0'
  # 只用身份切换，不打包浏览器 B 引擎；cargo test 也按此资源清单校验。
  TAURI_CONFIG: '{"bundle":{"resources":{"../browser-runtime/Browser.zip":null}}}'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 版本
        id: version
        run: |
          V=$(python3 -c "import json; print(json.load(open('packaging/cares/local-build.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "标签 $GITHUB_REF_NAME 与 local-build.json 版本 $V 不一致" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: 工具链与依赖
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: 下载测试用浏览器引擎
        if: github.ref_type != 'tag'
        run: python3 scripts/fetch-browser.py
      - name: 回归测试
        if: github.ref_type != 'tag'
        run: |
          bun test
          bun run build
          bun run test:identities
          identity_test="$RUNNER_TEMP/ccbaga-identity-test"
          clang -fobjc-arc -framework Foundation -framework Security src-tauri/native/IdentityTests.m -o "$identity_test"
          "$identity_test"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: 构建 CCD Switch
        run: bun run tauri build --debug --bundles app --features custom-protocol --config packaging/cares/local-build.json
      - name: 打包
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p out
          ditto -c -k --keepParent "src-tauri/target/debug/bundle/macos/CCD Switch.app" "out/CCD-Switch_${V}_macos_arm64.zip"
          cd out && shasum -a 256 *.zip > checksums.txt && cat checksums.txt
      - uses: actions/upload-artifact@v5
        with:
          name: CCD-Switch-${{ steps.version.outputs.version }}-macos-arm64
          path: out/
      - name: 发布 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes "CCD Switch（原 CCBaga-A）本地维护构建（身份管理专用），基于上游 ${GITHUB_REF_NAME%%+*}；ad-hoc 签名，仅供 mbp 安装脚本使用"
