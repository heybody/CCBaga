<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- CCD Switch 应用图标源：深色底、两张身份插槽（当前为绿点高亮）与切换箭头；由 scripts/make-icons.sh 渲染并套平台圆角 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232a2e"/><stop offset="1" stop-color="#0f1315"/></linearGradient>
    <linearGradient id="on" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f4a3e"/><stop offset="1" stop-color="#1a2b27"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/></pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <rect x="130" y="250" width="600" height="210" rx="48" fill="url(#on)" stroke="#5dcaa5" stroke-width="12"/>
  <circle cx="240" cy="355" r="40" fill="#5dcaa5"/>
  <circle cx="240" cy="355" r="62" fill="none" stroke="#5dcaa5" stroke-opacity=".35" stroke-width="10"/>
  <rect x="330" y="318" width="280" height="34" rx="17" fill="#eef2f3"/>
  <rect x="330" y="376" width="180" height="26" rx="13" fill="#8fb8ab"/>
  <rect x="130" y="564" width="600" height="210" rx="48" fill="#1c2225" stroke="#3a454b" stroke-width="12"/>
  <circle cx="240" cy="669" r="36" fill="none" stroke="#7d8a90" stroke-width="12"/>
  <rect x="330" y="632" width="280" height="34" rx="17" fill="#7d8a90"/>
  <rect x="330" y="690" width="180" height="26" rx="13" fill="#4d585e"/>
  <g fill="none" stroke="#5dcaa5" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M770 676 C 910 630, 910 410, 778 362"/>
    <path d="M816 316 L 774 360 L 830 388"/>
  </g>
</svg>
